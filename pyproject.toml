[project]
name = "pharmasignal"
version = "0.1.0"
description = "Educational synthetic adverse-event report triage pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Proposed implementation dependencies, not yet resolved or installation-tested.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<1.8",
    "scipy>=1.12,<2",
    "joblib>=1.3,<2",
    "spacy>=3.7,<3.9",
    "mlflow>=2.16,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dashboard = [
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pharmasignal"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
# The Streamlit script is executed by Streamlit's own runner, which coverage cannot
# trace; it is exercised end-to-end by tests/test_dashboard.py (AppTest).
omit = ["src/pharmasignal/dashboard/app.py"]
